name: CI

on:
  push:
    branches: [main, myGLaDOS]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (PortAudio, espeak-ng)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 espeak-ng

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra cpu --extra dev --locked

      # The ONNX models are release assets, not tracked in git; cache them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            models/ASR/*.onnx
            models/TTS/*.onnx
            models/TTS/*.bin
          key: models-${{ hashFiles('src/glados/cli.py') }}

      - name: Download models
        run: uv run --no-sync glados download

      # Bug-class rules everywhere; the full rule set only where it is already clean.
      # Add a package to the second list once `ruff check <package>` passes.
      - name: Lint
        run: |
          uv run --no-sync ruff check src tests --select F,E9,B,PLE
          uv run --no-sync ruff check src/glados/ASR src/glados/TTS src/glados/api src/glados/audio_io \
            src/glados/glados_ui src/glados/observability src/glados/utils src/glados/vision

      - name: Test
        run: uv run --no-sync pytest -q

  typecheck:
    # Informational until the ~500 existing strict-mode errors are worked down.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra cpu --extra dev --locked
      - name: mypy (strict, from pyproject)
        run: uv run --no-sync --with mypy mypy src/glados --ignore-missing-imports
