[project]
name = "glados"
version = "0.1.0"
description = "GLaDOS Voice Assistant"
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.5.1",
    "levenshtein>=0.26.1",
    "loguru>=0.7.3",
    "jinja2>=3.1.5",
    "requests>=2.32.3",
    "opencv-python>=4.12.0,<5",
    "textual>=1.0.0",
    "pyyaml>=6.0.2",
    "numba>=0.61.0",
    "soundfile>=0.13.0",
    "regex>=2024.5.15",
    "pydantic>=2.10.6",
    "jsonschema>=4.26.0",
    "httpx>=0.28.1",
    "rich>=14.0.0",
    "threadpoolctl>=3.0.0",
    "mcp>=1.25.0,<2.0.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.16.0"]
cpu = ["onnxruntime>=1.16.0"]
tiktoken = ["tiktoken>=0.5.0"]
dev = [
    "pytest",
    "pytest-anyio",
    "pytest-loguru",
    "pytest-mock",
    "ruff",
    "ipykernel",
    "mypy",
    "types-jsonschema",
    "types-psutil",
    "types-PyYAML",
    "types-regex",
    "types-requests",
]
export = [
    "nemo_toolkit[asr]>=2.6.1",
    "onnx>=1.20.1",
    "onnxconverter-common>=1.16.0",
]
api = ["litestar[standard,structlog]>=2.15.1"]

[project.scripts]
glados = "glados.cli:main"


# Build system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff configuration
[tool.ruff]
# Same as Black
line-length = 120
indent-width = 4

# Enable all rules, including those that replace Black and isort
# loguru's logger.exception() records the traceback, so an `except Exception` that calls it
# is a deliberate, logged boundary rather than a swallowed error (BLE001).
lint.logger-objects = ["loguru.logger"]
# Pylint's argument-count checks assume %-style logging; loguru formats with {} placeholders.
lint.ignore = ["PLE1205", "PLE1206"]
lint.extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "ANN", # Annotation rules
    "PYI", # Type stub rules
]

# Assume Python 3.12
target-version = "py312"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint.per-file-ignores]
# Test functions and fixtures are not an API; annotating every one adds noise, not safety.
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
order-by-type = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Third-party packages that ship neither inline types nor stubs on PyPI.
module = ["onnxruntime.*", "sounddevice.*", "soundfile.*", "threadpoolctl.*", "numba.*", "litestar.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The API server uses litestar from the optional "api" extra; without it installed its decorators are untyped.
module = ["glados.api.*"]
disallow_untyped_decorators = false
